# Local Windows/macOS/Linux development. Published API is loopback-only.
name: tendr-local
x-backend: &backend
  build:
    context: ..
    dockerfile: backend/Dockerfile
  env_file:
    - path: ../.env
      required: false
  environment:
    APP_ENV: dev
    DATABASE_URL: postgresql+asyncpg://tendr:tendr-local-dev@postgres:5432/tendr
    DATABASE_URL_SYNC: postgresql://tendr:tendr-local-dev@postgres:5432/tendr
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    ANALYSIS_JOB_MODE: local
    ANALYSIS_JOB_STORAGE_DIR: /var/lib/tendr/analysis-jobs
    ALLOWED_HOSTS: localhost,127.0.0.1
    ALLOWED_FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  volumes:
    - analysis_jobs:/var/lib/tendr/analysis-jobs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tendr
      POSTGRES_USER: tendr
      POSTGRES_PASSWORD: tendr-local-dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tendr -d tendr"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.15.5
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; read -r protocol status rest <&3; test \"$$status\" = 200"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${TENDR_LOCAL_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://localhost:8000/api/health/live',timeout=3).status==200"]
      interval: 5s
      timeout: 4s
      retries: 20
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  analysis_jobs:
