[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tendr-backend"
version = "0.1.0"
description = "Tendr backend: API, agents, RAG, LLM providers"
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    # HTTP / парсинг
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-docx>=1.1",         # чтение .docx
    "pypdf>=4.2",                # чтение .pdf
    "reportlab>=4.2",             # безопасная генерация PDF-отчётов и ТЗ
    # RAG / LLM
    "qdrant-client>=1.9",
    "sentence-transformers>=5.0",  # локальный эмбеддер (fallback, alemllm не умеет embed)
    "tenacity>=8.3",             # ретраи для API
    # Логи
    "loguru>=0.7",
    # Утилиты
    "python-dotenv>=1.0",
    "tzdata>=2024.1",           # IANA timezone database for Windows
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
