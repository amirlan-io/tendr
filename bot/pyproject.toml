[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tendr-bot"
version = "0.1.0"
description = "Tendr Telegram bot"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.10",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*"]
